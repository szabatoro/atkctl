[project]
name = "atkctl"
version = "0.1.0"
description = "ATK A9 PRO MAX 2.0 NK mouse — battery monitor and config tool (BITMOUSE protocol)"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "ATK Mouse contributors" },
]
requires-python = ">=3.13"
dependencies = [
    "hid>=1.0.6",
]

[project.scripts]
atkctl = "atkctl.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"