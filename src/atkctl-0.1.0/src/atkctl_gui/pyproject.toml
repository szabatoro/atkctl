[project]
name = "atkctl-gui"
version = "0.1.0"
description = "ATK mouse — Qt6 configuration GUI (PySide6)"
license = "BSD-3-Clause"
requires-python = ">=3.13"
dependencies = [
    "atkctl>=0.1.0",
    "pyside6>=6.12.0",
]

[project.scripts]
atkctl-gui = "atkctl_gui.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"